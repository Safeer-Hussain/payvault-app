name: pay_vault
description: "PayVault - Next-Generation Enterprise FinTech Neo-Bank and Multi-Currency Digital Vault."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  get_it: ^9.3.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path: ^1.9.1
  path_provider: ^2.1.6
  dio: ^5.11.1
  fl_chart: ^1.3.1
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
